# 🤖 Generated wholly or partially with GPT-5.6 Sol; OpenAI Codex
name: Build FOSS Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "**"
    branches:
      - "**"
    paths:
      - .github/workflows/android.yml
      - android/**
      - assets/**
      - lib/**
      - packages/**
      - patches/**
      - pubspec.lock
      - pubspec.yaml
      - rust-toolchain.toml

jobs:
  build-android-foss:
    name: Build FOSS APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: "./.github/shared_workflows/install_apt_dependencies"

      - name: Setup Flutter
        uses: adil192/setup-flutter-submodule@v3
        with:
          flutter-path: submodules/flutter
          no-save-caches: true

      - name: Restore platform-agnostic cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            .dart_tool/
            .flutter-plugins-dependencies
            build/
            packages/**/.dart_tool/
            packages/**/.flutter-plugins-dependencies
            packages/**/pubspec.lock
            ~/.dartServer/
            ~/.dart-tool/
          key: ${{ runner.OS }}-saber-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.OS }}-saber-

      - name: Restore Android cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            android/.gradle/
            android/.kotlin/
            submodules/flutter/bin/cache/
            submodules/flutter/packages/flutter_tools/gradle/build/
          key: ${{ runner.OS }}-saber_android

      - name: Setup Java
        uses: actions/setup-java@v5.6.0
        with:
          distribution: microsoft
          java-version: "21"

      - name: Configure community release signing
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SABER_SIGNING_STORE_PASSWORD: ${{ secrets.SABER_SIGNING_STORE_PASSWORD }}
          SABER_SIGNING_KEY_ALIAS: ${{ secrets.SABER_SIGNING_KEY_ALIAS }}
          SABER_SIGNING_KEY_PASSWORD: ${{ secrets.SABER_SIGNING_KEY_PASSWORD }}
        run: |
          missing=()
          for name in SIGNING_KEY SABER_SIGNING_STORE_PASSWORD SABER_SIGNING_KEY_ALIAS SABER_SIGNING_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          keystore="${RUNNER_TEMP}/saber-community.keystore"
          if [ ${#missing[@]} -eq 0 ]; then
            printf '%s' "$SIGNING_KEY" | base64 --decode > "$keystore"
          else
            echo "Signing secrets are incomplete (${missing[*]}); generating an ephemeral development key."
            SABER_SIGNING_STORE_PASSWORD=$(openssl rand -hex 24)
            SABER_SIGNING_KEY_ALIAS=saber-development
            SABER_SIGNING_KEY_PASSWORD=$SABER_SIGNING_STORE_PASSWORD
            keytool -genkeypair -noprompt \
              -keystore "$keystore" \
              -storepass "$SABER_SIGNING_STORE_PASSWORD" \
              -alias "$SABER_SIGNING_KEY_ALIAS" \
              -keypass "$SABER_SIGNING_KEY_PASSWORD" \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 4096 \
              -validity 1 \
              -dname "CN=Saber Development Build, O=Saber Community"
          fi
          chmod 600 "$keystore"
          {
            echo "SABER_SIGNING_STORE_FILE=$keystore"
            echo "SABER_SIGNING_STORE_PASSWORD=$SABER_SIGNING_STORE_PASSWORD"
            echo "SABER_SIGNING_KEY_ALIAS=$SABER_SIGNING_KEY_ALIAS"
            echo "SABER_SIGNING_KEY_PASSWORD=$SABER_SIGNING_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Setup Rust
        uses: moonrepo/setup-rust@v1
        with:
          targets: armv7-linux-androideabi,aarch64-linux-android,x86_64-linux-android

      - name: Disable Flutter CLI animations
        run: flutter config --no-cli-animations

      - run: ./patches/pre/remove_dev_dependencies.sh
      - run: ./patches/pre/remove_linux_dependencies.sh
      - run: ./patches/pre/remove_proprietary_dependencies.sh
      - run: flutter pub get
      - run: ./patches/post/patch_rust_versions.sh

      - name: Build FOSS APK
        run: flutter build apk

      - name: Rename APK
        id: rename_apk
        run: |
          sourceApk=build/app/outputs/flutter-apk/app-release-community-signed.apk
          if [ ! -f "$sourceApk" ]; then
            echo "Expected community-signed APK not found: $sourceApk" >&2
            find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' -print >&2
            exit 1
          fi

          buildName=$(grep -oP "(?<=buildName = ').*(?=')" lib/data/version.dart)
          apkName="Saber_FOSS_v${buildName}.apk"
          echo "apkName=$apkName" >> "$GITHUB_OUTPUT"
          mkdir -p output
          mv "$sourceApk" "output/$apkName"

      - name: Upload FOSS APK
        uses: actions/upload-artifact@v7
        with:
          name: Saber-Android-FOSS
          path: output/${{ steps.rename_apk.outputs.apkName }}
          if-no-files-found: error
