name: "Install apt dependencies"
description: "Installs and caches apt dependencies for building Saber"

runs:
  using: "composite"
  steps:
    - name: Install apt dependencies
      uses: awalsh128/cache-apt-pkgs-action@v1
      with:
        packages: >-
          libgtk-3-dev
          libglib2.0-dev
          libx11-dev
          pkg-config
          cmake
          ninja-build
          curl
          libcurl4-openssl-dev
          libblkid-dev
          libsecret-1-dev
          libjsoncpp-dev
          ghostscript
          libunwind-dev
          webkit2gtk-4.1-dev
        version: 1.1
        execute_install_scripts: true
