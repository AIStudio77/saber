name: "Install apt dependencies"
description: "Installs apt dependencies for building Saber"

runs:
  using: "composite"
  steps:
    - name: Install apt dependencies
      shell: bash
      run: |
        sudo apt-get update -o Acquire::Retries=3

        sudo apt-get install -y -o Acquire::Retries=3 \
          libgtk-3-dev \
          libglib2.0-dev \
          libx11-dev \
          pkg-config \
          cmake \
          ninja-build \
          curl \
          libcurl4-openssl-dev \
          libblkid-dev \
          libsecret-1-dev \
          libjsoncpp-dev \
          ghostscript \
          libunwind-dev \
          libwebkit2gtk-4.1-dev

    - name: Verify native dependencies
      shell: bash
      run: |
        pkg-config --modversion glib-2.0
        pkg-config --modversion gobject-2.0
        pkg-config --modversion gio-2.0
        pkg-config --modversion gtk+-3.0
